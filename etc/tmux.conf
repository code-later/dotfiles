# Make the OSX pasteboard work
set -g default-command "/opt/homebrew/bin/reattach-to-user-namespace -l zsh"

# Enable vi-style
set-window-option -g mode-keys vi

# Replace split-window binding
unbind %
bind | split-window -h
bind \\ split-window -h
bind - split-window -v

# Terminal type configuration
#set -g default-terminal "xterm-24bit"
#set -g terminal-overrides ",xterm-24bit:Tc"

# Set that stupid Esc-Wait off, so VI works again
set-option -sg escape-time 0

# And pass sequences with modifiers xterm compatible
setw -g xterm-keys on

# Enable the mouse
set -g mouse on

# Easy send and join panes
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

# Reload config
bind R source-file ~/.tmux.conf \; display-message "Configuration reloaded..."

# Quick process overview
bind '~' split-window "gotop || top"

# Quick jump to a IRB
bind '/' split-window "irb"

# Toggle synchronize panels
bind S set-window synchronize-panes

# Pretty status line
set -g status-position top
set -g status on
set -g status-style fg=magenta
set -g status-style bg=default
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 50
set -g status-right-length 60

set -g status-left '手術 #S '
set -g status-right '#[fg=brightmagenta] #(show-branch #{pane_current_path}) • 時%R '

# Highlight active window / pane
set-option -g pane-border-style fg=white,bg=default
set-option -g pane-active-border-style fg=magenta,bg=default

# Set window notifications
set -g visual-activity off
set-window-option -g monitor-activity on
set-window-option -g window-status-activity-style fg=magenta,bg=default,underscore

# Set status-line bg in command mode
set -g message-style fg=white,bg=blue
set -g message-command-style fg=white,bg=blue

# Remove the window flags from the status line
set-window-option -g window-status-separator " "
set-window-option -g window-status-current-format '#[fg=white,bg=magenta,bold]今 #I:#W/#P #[fg=magenta,bg=default]'
set-window-option -g window-status-format '#[fg=magenta]#I:#W'

# Use session name for terminal window
set -g set-titles on
set -g set-titles-string "#{session_name} - #{host}"
set-window-option -g allow-rename on
set-window-option -g automatic-rename on

# Let the pane and window index start at 1
set  -g base-index 1
setw -g pane-base-index 1

# Configure main-pane-{width,height} for automatic layouts
set -g main-pane-height 50
set -g main-pane-width 180

# Move between panes without prefix
bind -n    C-Up select-pane -U
bind -n  C-Down select-pane -D
bind -n  C-Left select-pane -L
bind -n C-Right select-pane -R

# Move between panes with prefix
bind-key -r  M-k select-pane -U
bind-key -r  M-j select-pane -D
bind-key -r  M-h select-pane -L
bind-key -r  M-l select-pane -R

# Window movement with SHIFT + Arrow
bind-key -r S-Left select-window -p
bind-key -r S-Right select-window -n

# Switch resize setpsize
bind-key -r  K resize-pane -U 5
bind-key -r  J resize-pane -D 5
bind-key -r  H resize-pane -L 5
bind-key -r  L resize-pane -R 5
bind-key z resize-pane -Z

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
